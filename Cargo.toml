[package]
name = "dorsal-finance"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = "0.4.45"
rust_decimal = { version = "1.43.0", features = ["macros"] }
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread"] }
uuid = { version = "1.26.1",features = ["v4"] }
yahoo_finance_api = "5"
time = { version = "0.3", features = ["macros"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "macros", "migrate", "uuid"] }
dotenvy = "0.15.7"

